apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
  generation: 1
  name: my-cluster
  namespace: strimzi
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.min.isr: 2
      transaction.state.log.replication.factor: 3
    listeners:
      - name: plain
        port: 9092
        tls: false
        type: internal
      - name: tls
        port: 9093
        tls: true
        type: internal
    metadataVersion: 4.0-IV3
    version: 4.0.0

---

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  labels:
    strimzi.io/cluster: my-cluster
  name: my-pool
  namespace: strimzi
spec:
  replicas: 3
  roles:
  - broker
  storage:
    type: jbod
    volumes:
    - deleteClaim: false
      id: 0
      size: 100Gi
      type: persistent-claim

---

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  generation: 1
  labels:
    strimzi.io/cluster: my-cluster
  name: my-poolc
  namespace: strimzi
spec:
  replicas: 3
  roles:
  - controller
  storage:
    type: jbod
    volumes:
    - deleteClaim: false
      id: 0
      size: 100Gi
      type: persistent-claim

